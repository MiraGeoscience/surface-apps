schema_version: 1

context:
  name: "surface-apps"
  version: "0.2.0a1"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../${{ name }}

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - poetry-core >=1.0.0
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.26.0,<1.27.0
    - scipy >=1.14.0,<1.15.0
    - pydantic >=2.5.2,<2.6.0
    - geoh5py 0.10.*
    - geoapps-utils 0.4.*
    - pillow >=10.3.0,<10.4.0
    - h5py >=3.2.1,<4.0.0
    - scikit-image >=0.24.0,<0.25.0
    - tqdm >=4.66.1,<4.67.0

tests:
  - python:
      imports:
        - surface_apps
  - requirements:
      run:
        - pip
    script:
      - pip check

about:
  summary: Surface detection within geoscientific data.
  license: MIT
  license_file: LICENSE
  homepage: https://www.mirageoscience.com/mining-industry-software/python-integration/
  repository: https://github.com/MiraGeoscience/surface-apps

extra:
  recipe-maintainers:
    - andrewg-mira
    - sebhmg
